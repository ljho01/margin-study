[package]
name = "margin-study"
version = "0.1.0"
description = "Local-first PDF study workspace"
edition = "2021"

[lib]
name = "margin_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
percent-encoding = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-util = "0.7"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSOperation", "NSGeometry", "NSRunLoop", "NSFileManager", "NSURL", "NSError", "NSBundle"] }

# Proc-macro and build-script dylibs stripped by the release profile fail to
# load on current macOS ("mis-aligned LINKEDIT string pool"). Only these build
# tools stay unstripped; the shipped binary is still stripped.
[profile.release.build-override]
strip = false
